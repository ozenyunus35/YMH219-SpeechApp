name: Windows derleme ve test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Derle
        run: dotnet build YMH219-SpeechApp.sln -c Release
      - name: Testler (sahte motorlar + gerçek Windows konuşma motoru)
        run: dotnet test YMH219-SpeechApp.sln -c Release --no-build --logger "console;verbosity=detailed"
